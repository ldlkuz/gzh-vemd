name: desktop-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @wemd/web run build

      - name: Install Electron deps
        run: cd apps/electron && pnpm install --frozen-lockfile

      - name: Sync disk before build
        run: sync

      - name: Build Electron (macOS)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd apps/electron && pnpm run build:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wemd-macos
          path: apps/electron/release/WeMD-*-arm64-mac.zip

      - name: Generate release body
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # 从上一个 tag 到本次 tag 提取提交，生成简洁的 Markdown 更新日志
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p' || true)
          {
            echo "## 更新内容"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s' --no-merges
            else
              git log --pretty=format:'- %s' -20
            fi
            echo
          } > release_body.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GZH-WeMD ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            apps/electron/release/WeMD-*-arm64-mac.zip
            apps/electron/release/latest-mac.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @wemd/web run build

      - name: Install Electron deps
        run: cd apps/electron && pnpm install --frozen-lockfile

      - name: Build Electron (Windows)
        run: cd apps/electron && pnpm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wemd-windows
          path: apps/electron/release/*.exe

      - name: Generate release body
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p' || true)
          {
            echo "## 更新内容"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s' --no-merges
            else
              git log --pretty=format:'- %s' -20
            fi
            echo
          } > release_body.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GZH-WeMD ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            apps/electron/release/*.exe
            apps/electron/release/latest.yml
          fail_on_unmatched_files: false

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @wemd/web run build

      - name: Install Electron deps
        run: cd apps/electron && pnpm install --frozen-lockfile

      - name: Build Electron (Linux)
        run: cd apps/electron && pnpm run build:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wemd-linux
          path: apps/electron/release/*.AppImage

      - name: Generate release body
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p' || true)
          {
            echo "## 更新内容"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s' --no-merges
            else
              git log --pretty=format:'- %s' -20
            fi
            echo
          } > release_body.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GZH-WeMD ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            apps/electron/release/*.AppImage
            apps/electron/release/latest-linux.yml
          fail_on_unmatched_files: false
